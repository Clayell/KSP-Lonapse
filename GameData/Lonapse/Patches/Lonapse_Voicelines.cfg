// Lonapse: every part with a command module gets ModuleLonapseVoicelines. It stores the action group voicelines the
// player sets up in the VAB or SPH, inside the craft and the save. The module does nothing else and shows nothing.
// Every command part of a craft holds the same copy, so the voicelines survive a new root part, staging and undocking.
// Module Manager is optional. Without it Lonapse adds the same module to the same parts itself when the game starts.

@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleLonapseVoicelines]]:FOR[Lonapse]
{
    MODULE
    {
        name = ModuleLonapseVoicelines
    }
}
